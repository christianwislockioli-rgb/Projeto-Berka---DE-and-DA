

# Orquestra PostgreSQL (OLTP), MongoDB (NoSQL), Apache Airflow e Metabase

version: '3.8'

services:
  # 1. Banco Relacional Transacional (OLTP em 3FN)
  postgres_oltp:
    image: postgres:15-alpine
    container_name: berka_postgres_oltp
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-berka_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-berka_oltp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Executa automaticamente a modelagem 3FN ao iniciar o banco pela primeira vez
      - ../../sql/ddl_oltp/create_tables_3nf.sql:/docker-entrypoint-initdb.d/01_create_tables_3nf.sql:ro
    networks:
      - berka_network

  # 2. Banco NoSQL (Logs de auditoria e documentos JSON semiestruturados)
  mongodb_nosql:
    image: mongo:6.0
    container_name: berka_mongodb_nosql
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mongo_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-secret}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - berka_network

  # 3. Orquestrador de Pipelines (Apache Airflow)
  airflow_webserver:
    image: apache/airflow:2.9.1-python3.11
    container_name: berka_airflow
    restart: unless-stopped
    depends_on:
      - postgres_oltp
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-berka_admin}:${POSTGRES_PASSWORD:-secret}@postgres_oltp:5432/${POSTGRES_DB:-berka_oltp}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ../../dags:/opt/airflow/dags
      - ../../src:/opt/airflow/src
    ports:
      - "8080:8080"
    command: standalone
    networks:
      - berka_network

  # 4. Camada de BI Open-Source (Metabase)
  metabase_bi:
    image: metabase/metabase:latest
    container_name: berka_metabase
    restart: unless-stopped
    depends_on:
      - postgres_oltp
    ports:
      - "3000:3000"
    networks:
      - berka_network

volumes:
  postgres_data:
  mongo_data:

networks:
  berka_network:
    driver: bridge